# Local Airflow for the pipeline. One container runs every Airflow component
# ("airflow standalone") with an SQLite metadata database: fine for one daily job on a laptop.

services:
  airflow:
    build: .
    command: standalone
    user: "${AIRFLOW_UID: -50000}:0"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "sqlite:////opt/airflow/state/airflow.db"
      SODA_APP_TOKEN: "${SODA_APP_TOKEN:-}"
      S3_BUCKET: "${S3_BUCKET:-calgary-services-and-requests-data-pipeline}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-ca-west-1}"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./include:/opt/airflow/include
      - ./raw:/opt/airflow/raw
      - airflow-state:/opt/airflow/state

volumes:
  airflow-state: