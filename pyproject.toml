[project]
name = "stratayyc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LilyFae", email = "andrew.patton@ucalgary.ca" }
]
requires-python = ">=3.14"
dependencies = [
    "apache-airflow==3.4.0",
    "boto3==1.44.2",
    "polars==2.1.0",
    "pyarrow==26.0.1",
    "pytest==9.2.0",
    "requests==2.32.4",
    "ruff==0.17.5",
]

[project.scripts]
stratayyc = "stratayyc:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = [".", "include"]
